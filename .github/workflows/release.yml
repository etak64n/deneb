# Publishes the image to ghcr.io/etak64n/deneb for every tag v*, for amd64 and
# arm64. Each architecture builds on a runner of its own, which is far faster than
# emulation, and runs the end-to-end tests there. A job joins the images that passed
# under one tag, and the last one publishes the GitHub release of the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # A release builds from nothing. The cache of CI holds what any job on main
          # wrote, and an image that ships takes the packages of its own day.
          no-cache: true

      # The image that the tags will name runs the end-to-end tests first. An image that
      # fails them stays in the registry under its digest alone, and the job stops here.
      - run: ./test/e2e.sh "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" local

      - run: ./test/e2e.sh "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" s3

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 is published as 1.2.3, 1.2, and latest, which the action adds to a
      # version that is not a prerelease; v1.3.0-rc.1 only as 1.3.0-rc.1.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Join the architectures under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  # The GitHub release comes after the image that it announces. The tag must be
  # annotated, and its message becomes the notes of the release: changes reach main
  # as commits rather than pull requests, so notes that GitHub generates would list
  # nothing.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The checkout points the tag at the commit and leaves out the tag object, which
      # holds the message. Fetching the tag itself brings the message back.
      - name: Fetch the message of the tag
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "The tag $GITHUB_REF_NAME has no message. Tag with git tag -a, and write the notes of the release in the message." >&2
            exit 1
          fi

      # A version with a hyphen, such as v1.3.0-rc.1, is a prerelease, as for the image.
      - name: Publish the release
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "deneb $GITHUB_REF_NAME" --notes-from-tag --verify-tag "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
