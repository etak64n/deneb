# Records a demo of the dashboard on demand, as a GIF for READMEs and an MP4 for
# posts, which the run keeps as the artifact named demo.
name: Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: deneb:demo
          cache-from: type=gha,scope=linux/amd64

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: test/browser/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: test/browser/pnpm-lock.yaml

      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends espeak-ng

      - run: pnpm --dir test/browser install --frozen-lockfile

      # Playwright records pages with an ffmpeg of its own, apart from the browser.
      - run: pnpm --dir test/browser exec playwright install ffmpeg

      - run: ./test/browser/run.sh deneb:demo demo.mjs

      - run: ./test/browser/gif.sh deneb:demo test/browser/out/demo

      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: |
            test/browser/out/demo/demo.gif
            test/browser/out/demo/demo.mp4
            test/browser/out/demo/still_*.png
            test/browser/out/demo/seek-preview.png
          retention-days: 30
