# Checks deneb on every push to main and every pull request: the Go code with its
# tests, the dashboard, and the Docker image, which test/e2e.sh runs end to end over
# the API on amd64 and arm64, and test/browser/run.sh through the dashboard.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The media tests run ffmpeg, and skip without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version that "packageManager" in web/package.json names.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm exec vite build

  # The image on both architectures that it ships for, each on a runner of its own,
  # with its media on the volume and in a bucket.
  e2e:
    name: e2e (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The caches are those of the release workflow, so that each warms the other.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: deneb:e2e
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - run: ./test/e2e.sh deneb:e2e local

      - run: ./test/e2e.sh deneb:e2e s3

  # The dashboard in Google Chrome, on amd64 only: Playwright runs Chrome on Linux for
  # amd64 alone, and the dashboard is the same JavaScript on every architecture.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: deneb:e2e
          cache-from: type=gha,scope=linux/amd64

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: test/browser/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: test/browser/pnpm-lock.yaml

      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends espeak-ng

      - run: pnpm --dir test/browser install --frozen-lockfile

      - run: ./test/browser/run.sh deneb:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: test/browser/out/dashboard/
          if-no-files-found: ignore
          retention-days: 14
