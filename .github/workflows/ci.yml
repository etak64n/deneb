# Checks deneb on every push to main and every pull request: the Go code with its
# tests, the dashboard, and the Docker image, which test/e2e.sh runs end to end over
# the API and test/browser/run.sh through the dashboard.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The media tests run ffmpeg, and skip without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version that "packageManager" in web/package.json names.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm exec vite build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: deneb:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: ./test/e2e.sh deneb:e2e local

      - run: ./test/e2e.sh deneb:e2e s3

      # The same image again, through its dashboard in Google Chrome, which the runner has.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: test/browser/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: test/browser/pnpm-lock.yaml

      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends espeak-ng

      - run: pnpm --dir test/browser install --frozen-lockfile

      - run: ./test/browser/run.sh deneb:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: test/browser/screenshots/
          if-no-files-found: ignore
          retention-days: 14
