<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The icon of deneb in a browser tab. A tab draws it at 16 pixels, where the whole tile
       looks small beside the icons of other sites, so it shows the middle of the tile, 1.3
       times as large. On dark tabs, which hide the navy tile, the tile is lighter. -->
  <style>
    .on-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .on-light { display: none; }
      .on-dark { display: inline; }
    }
  </style>
  <image class="on-light" width="64" height="64" href="data:image/png;base64,"/>
  <image class="on-dark" width="64" height="64" href="data:image/png;base64,"/>
</svg>
